#
# /etc/pacman.conf
#
# See the pacman.conf(5) manpage for option and repository directives

#
# GENERAL OPTIONS
#
[options]
# The following paths are commented out with their default values listed.
# If you wish to use different paths, uncomment and update the paths.
#RootDir     = /
#DBPath      = /var/lib/pacman/
#CacheDir    = /var/cache/pacman/pkg/
#LogFile     = /var/log/pacman.log
#GPGDir      = /etc/pacman.d/gnupg/
#HookDir     = /etc/pacman.d/hooks/
HoldPkg     = pacman glibc
#XferCommand = /usr/bin/curl -L -C - -f -o %o %u
#XferCommand = /usr/bin/wget --passive-ftp -c -O %o %u
#CleanMethod = KeepInstalled
#UseDelta    = 0.7
Architecture = auto

# Pacman won't upgrade packages listed in IgnorePkg and members of IgnoreGroup
#IgnorePkg   =
#IgnoreGroup =

#NoUpgrade   =
#NoExtract   =

# Misc options
#UseSyslog
Color
ILoveCandy
#NoProgressBar
#CheckSpace
VerbosePkgLists
DisableDownloadTimeout
ParallelDownloads = 10
DownloadUser = alpm
#DisableSandbox

# By default, pacman accepts packages signed by keys that its local keyring
# trusts (see pacman-key and its man page), as well as unsigned packages.
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
#RemoteFileSigLevel = Required

# NOTE: You must run `pacman-key --init` before first using pacman; the local
# keyring can then be populated with the keys of all official Arch Linux
# packagers with `pacman-key --populate archlinux`.

#
# REPOSITORIES
#   - can be defined here or included from another file
#   - pacman will search repositories in the order defined here
#   - local/custom mirrors can be added here or in separate files
#   - repositories listed first will take precedence when packages
#     have identical names, regardless of version number
#   - URLs will have $repo replaced by the name of the current repo
#   - URLs will have $arch replaced by the name of the architecture
#
# Repository entries are of the format:
#       [repo-name]
#       Server = ServerName
#       Include = IncludePath
#
# The header [repo-name] is crucial - it must be present and
# uncommented to enable the repo.
#

##
## [kedra] -- KEDRA
##
## Top priority, for the reason documented in the build-time pacman.conf: it is
## what makes kedra-hooks the identity owner instead of cachyos-hooks.
##
## SigLevel = Required. The live keyring is populated with Kedra trust at image
## build time (kedra-keyring is in packages_desktop.x86_64) and again at boot by
## pacman-init.service, which runs `pacman-key --populate` over every keyring in
## /usr/share/pacman/keyrings -- kedra.gpg included.
##
## DEVELOPMENT SOURCE. No public Kedra repository domain has been chosen, so
## rather than invent a URL the signed [kedra] docroot is copied INTO the image
## at /usr/share/kedra/repo by prepare_kedra_build_tree() (util-iso.sh). The
## live system therefore resolves [kedra] offline, with signatures verified
## normally.
##
## Replacing this with real hosting is a one-line change:
##     Server = https://<kedra-host>/$repo/os/$arch
## plus dropping the copy step in util-iso.sh. A `Server =` line is used rather
## than an `Include =` so there is no dangling include to break `pacman-key`.
[kedra]
SigLevel = Required DatabaseOptional
Server = file:///usr/share/kedra/repo/$repo/os/$arch

##
## [cachyos] -- CACHYOS
##
## KEDRA: upstream's CachyOS live ISO overrides this stanza with
##
##     SigLevel = Optional TrustAll
##
## which is strictly weaker than the global policy set in [options]: `Optional`
## accepts an unsigned package, and `TrustAll` accepts a signature from a key
## the keyring does not trust. Together they mean any package served from a
## CachyOS mirror -- including a substituted one -- installs on the live system
## without a valid signature, on the ISO that then installs the system.
##
## The override is removed rather than replaced, so [cachyos] inherits the
## global `SigLevel = Required DatabaseOptional` like every other repository
## here. Nothing is lost: cachyos-keyring ships in the live package list and
## pacman-init.service populates it at boot, so CachyOS signatures verify
## normally. The build-time pacman.conf and pacman-more.conf never carried the
## override, so this makes the live system agree with them.
##
## Enforced by bin/kedra-iso-validate, which now evaluates the EFFECTIVE
## per-repository policy rather than grepping for one forbidden string.
[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

# The testing repositories are disabled by default. To enable, uncomment the
# repo name header and Include lines. You can add preferred servers immediately
# after the header, and they will be used before the default mirrors.

#[core-testing]
#Include = /etc/pacman.d/mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

#[extra-testing]
#Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# If you want to run 32 bit applications on your x86_64 system,
# enable the multilib repositories as required here.

#[multilib-testing]
#Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# An example of a custom package repository.  See the pacman manpage for
# tips on creating your own repositories.
#[custom]
#SigLevel = Optional TrustAll
#Server = file:///home/custompkgs
