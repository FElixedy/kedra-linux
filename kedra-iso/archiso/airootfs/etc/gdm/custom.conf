# GDM configuration for the Kedra live session.
#
# Replaces the Plasma live autologin (etc/plasmalogin.conf upstream). The live
# user has an EMPTY password and is a member of the `nopasswdlogin` group, which
# Arch's GDM PAM stack honours.
#
# WaylandEnable is left at its default (true): GNOME is the Kedra default
# session and Wayland is GNOME's default. GDM falls back to Xorg automatically
# on drivers that cannot do Wayland.

[daemon]
AutomaticLoginEnable=True
AutomaticLogin=liveuser

[security]

[xdmcp]

[chooser]

[debug]
# Uncomment to get verbose GDM logging into the journal when debugging a live
# session that fails to start.
#Enable=true
