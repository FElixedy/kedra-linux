#
# /etc/pacman.conf
#
# See the pacman.conf(5) manpage for option and repository directives

#
# GENERAL OPTIONS
#
[options]
# The following paths are commented out with their default values listed.
# If you wish to use different paths, uncomment and update the paths.
#RootDir     = /
#DBPath      = /var/lib/pacman/
##
## CacheDir -- KEDRA
##
## The system cache (/var/cache/pacman/pkg) is root-owned and so is not
## writable during a rootless build: inside the user namespace we look like
## uid 0, but the kernel still checks the real uid against the on-disk owner.
## mkarchiso uses a profile CacheDir whenever it differs from the system one,
## so this points at a directory the build user owns. Substituted by
## prepare_kedra_build_tree(); see bin/_kedra.sh.
CacheDir    = @KEDRA_ISO_CACHEDIR@/
#LogFile     = /var/log/pacman.log
#HookDir     = /etc/pacman.d/hooks/
##
## GPGDir -- KEDRA
##
## mkarchiso expands this file with `pacman-conf` and strips RootDir, DBPath,
## CacheDir, HookDir and LogFile (they would break `pacman -r`), but it does NOT
## strip GPGDir. Left at its default, pacstrap would therefore verify every
## package against the BUILD HOST's /etc/pacman.d/gnupg, which would mean the
## host keyring has to be taught to trust Kedra before an ISO can be built.
##
## Kedra does not modify the build host. Instead the placeholder below is
## replaced by prepare_kedra_build_tree() (util-iso.sh) with a build-local
## keyring created by bin/kedra-iso-keyring-init, holding archlinux + cachyos +
## kedra trust. Signature verification stays fully enabled; only the location of
## the trust store changes.
GPGDir      = @KEDRA_ISO_GPGDIR@/
HoldPkg     = pacman glibc
#XferCommand = /usr/bin/curl -L -C - -f -o %o %u
#XferCommand = /usr/bin/wget --passive-ftp -c -O %o %u
#CleanMethod = KeepInstalled
Architecture = auto

# Pacman won't upgrade packages listed in IgnorePkg and members of IgnoreGroup
#IgnorePkg   =
#IgnoreGroup =

#NoUpgrade   =
#NoExtract   =

# Misc options
#UseSyslog
Color
ILoveCandy
#TotalDownload
# We cannot check disk space from within a chroot environment
#CheckSpace
VerbosePkgLists
DisableDownloadTimeout
ParallelDownloads = 10
# DownloadUser = alpm
DisableSandbox

# By default, pacman accepts packages signed by keys that its local keyring
# trusts (see pacman-key and its man page), as well as unsigned packages.
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
#RemoteFileSigLevel = Required

# NOTE: You must run `pacman-key --init` before first using pacman; the local
# keyring can then be populated with the keys of all official Arch Linux
# packagers with `pacman-key --populate archlinux`.

#
# REPOSITORIES
#   - can be defined here or included from another file
#   - pacman will search repositories in the order defined here
#   - local/custom mirrors can be added here or in separate files
#   - repositories listed first will take precedence when packages
#     have identical names, regardless of version number
#   - URLs will have $repo replaced by the name of the current repo
#   - URLs will have $arch replaced by the name of the architecture
#
# Repository entries are of the format:
#       [repo-name]
#       Server = ServerName
#       Include = IncludePath
#
# The header [repo-name] is crucial - it must be present and
# uncommented to enable the repo.
#

##
## [kedra] -- KEDRA
##
## Ordering: pacman resolves a name from the FIRST repository that carries it,
## so [kedra] sits above [cachyos] and Arch. That priority is what lets
## kedra-hooks replace cachyos-hooks while CachyOS keeps providing kernels,
## optimised builds and low-level tooling. The hazard of top priority is
## contained outside pacman by kedra-repo's publishing allowlist
## (config/kedra-repo-packages.txt), not by ordering tricks here.
##
## SigLevel is Required: Kedra never relies on SigLevel = Never. The key that
## satisfies it lives in the build-local GPGDir above.
##
## Server, not Include: `pacman-conf` resolves Include= against the BUILD HOST's
## filesystem, so an Include here would need /etc/pacman.d/kedra-mirrorlist to
## exist on every builder -- exactly the dangling-Include trap that silently
## breaks keyring bootstrap. A single Server line avoids it and avoids inventing
## a kedra-mirrorlist package for the one repository Kedra currently has.
##
## The placeholder is replaced at build time with the local development docroot
## (see bin/_kedra.sh). Publishing moves to HTTPS by replacing this one line
## with `Server = https://<host>/$repo/os/$arch` and dropping the substitution.
[kedra]
SigLevel = Required DatabaseOptional
Server = file://@KEDRA_REPO_ROOT@/$repo/os/$arch

# The testing repositories are disabled by default. To enable, uncomment the
# repo name header and Include lines. You can add preferred servers immediately
# after the header, and they will be used before the default mirrors.
[cachyos]
Server = https://mirror.cachyos.org/repo/$arch/$repo

#[core-testing]
#Include = /etc/pacman.d/mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

#[extra-testing]
#Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# If you want to run 32 bit applications on your x86_64 system,
# enable the multilib repositories as required here.

#[multilib-testing]
#Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# An example of a custom package repository.  See the pacman manpage for
# tips on creating your own repositories.
#[custom]
#SigLevel = Optional TrustAll
#Server = file:///home/custompkgs
