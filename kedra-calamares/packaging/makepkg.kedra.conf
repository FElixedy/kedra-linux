# makepkg configuration for building Kedra packages.
#
# Used via `MAKEPKG_CONF=packaging/makepkg.kedra.conf makepkg ...` (see
# packaging/kedra-calamares-buildroot), which makes makepkg source THIS file instead
# of /etc/makepkg.conf -- and, importantly, instead of /etc/makepkg.conf.d/*.
#
# WHY THIS IS NECESSARY
# ---------------------
# The Kedra development host is a CachyOS machine, and CachyOS's /etc/makepkg.conf
# ships:
#
#     CFLAGS="-march=native -O3 ..."
#     RUSTFLAGS="-C target-cpu=native"       (/etc/makepkg.conf.d/rust.conf)
#
# That is entirely correct for CachyOS's own optimised repositories, and wrong for
# a package that has to run on other people's computers. Built as-is on a Zen 5
# host, kedra-calamares would be compiled for znver4/x86-64-v4 and would die with
# SIGILL on any older CPU -- including the QEMU guests it is tested in. The ISO
# would boot and the installer would simply crash, on hardware the builder does
# not own and therefore never sees.
#
# So Kedra packages are built for the x86-64 baseline, which is what Arch itself
# targets. CachyOS's CPU-optimised builds stay where they belong: upstream, in the
# CachyOS repositories, selected at runtime per machine by cachyos-rate-mirrors.
# Kedra does not fork them and does not compete with them.
#
# Everything else -- hardening flags, LTO, compression, packaging options -- is
# inherited from the host configuration unchanged.

# shellcheck source=/etc/makepkg.conf
source /etc/makepkg.conf

CFLAGS="-march=x86-64 -mtune=generic -O2 -pipe -fno-plt -fexceptions \
        -Wp,-D_FORTIFY_SOURCE=3 -Wformat -Werror=format-security \
        -fstack-clash-protection -fcf-protection"
CXXFLAGS="$CFLAGS -Wp,-D_GLIBCXX_ASSERTIONS"
RUSTFLAGS="-C opt-level=2"

PACKAGER="Kedra Linux DEVELOPMENT <dev-packager@kedra.invalid>"
