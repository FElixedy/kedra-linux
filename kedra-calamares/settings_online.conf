#
# Configuration file for Calamares
---
modules-search: [ local ]

instances:

- id:       online
  module:   packages
  config:   packages_online.conf

- id:       online
  module:   welcome
  config:   welcome_online.conf

- id:       before-online
  module:   shellprocess
  config:   shellprocess-before-online.conf

- id:       modify_mk_hook
  module:   shellprocess
  config:   shellprocess_modify_mk_hook.conf

- id:       reset_mk_hook
  module:   shellprocess
  config:   shellprocess_reset_mk_hook.conf

- id:       initialize_pacman
  module:   shellprocess
  config:   shellprocess_initialize_pacman.conf

- id:       bootloader
  module:   packagechooser
  config:   packagechooser_bootloader.conf

- id:       desktop
  module:   packagechooser
  config:   packagechooser_desktop.conf

- id:       enable_ufw
  module:   shellprocess
  config:   shellprocess_enable_ufw.conf

- id:       greetd
  module:   shellprocess
  config:   shellprocess_greetd.conf

- id:       btrfs_snapshot
  module:   shellprocess
  config:   shellprocess_btrfs_snapshot.conf

- id:       kedra_verify
  module:   shellprocess
  config:   shellprocess_kedra_verify.conf

- id:       cleanup_calamares
  module:   shellprocess
  config:   shellprocess_cleanup_calamares.conf


sequence:
- show:
  - welcome@online
  - locale
  - keyboard
  - packagechooser@bootloader
  - partition
  - packagechooser@desktop
  # Which Kedra desktop experience to install. Placed after the desktop chooser
  # (the Experience layer is GNOME's) and before netinstall, because the package
  # set it resolves to has to be settled before the package page is shown.
  - kedraexperience
  - netinstall
  - users
  - summary
- exec:
  - partition
  - zfs
  - mount
  - shellprocess@modify_mk_hook
  - shellprocess@initialize_pacman
  - shellprocess@before-online
  - pacstrap
  - machineid
  - users
  - locale
  - keyboard
  - localecfg
  - chwd
  # Turns the chosen profile into target package additions by asking the shipped
  # resolver. Must precede packages@online, which is what carries out
  # packageOperations.
  - kedraexperiencepackages
  - packages@online
  - luksbootkeyfile
  - luksopenswaphookcfg
  - fstab
  - plymouthcfg
  - zfshostid
  - initcpiocfg
  - initcpio
  - networkcfg
  - displaymanager
  - hwclock
  - grubcfg
  - bootloader
  - shellprocess@reset_mk_hook
  - services-systemd
  - shellprocess
  # Records the chosen profile for the installed user. AFTER the step above,
  # which copies /etc/skel over the new home and would overwrite anything
  # written there earlier; before kedra_verify, so a failure still aborts the
  # installation.
  - kedraexperiencestate
  - shellprocess@enable_ufw
  - shellprocess@greetd
  - shellprocess@btrfs_snapshot
  # KEDRA: last real step. Aborts the installation rather than let a target that
  # is not a valid Kedra system be reported as a success.
  - shellprocess@kedra_verify
  - shellprocess@cleanup_calamares
  - umount
- show:
  - finished

branding: kedra

prompt-install: true

dont-chroot: false

oem-setup: false

disable-cancel: false

disable-cancel-during-exec: false

hide-back-and-next-during-exec: true

quit-at-end: false
