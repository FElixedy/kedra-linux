#
# /etc/pacman.conf -- as installed by the Kedra Linux installer
#
# See the pacman.conf(5) manpage for option and repository directives
#
# THIS FILE IS THE INSTALLED SYSTEM'S PACMAN CONFIGURATION.
#
# Upstream's installer copies the live medium's /etc/pacman-more.conf into the
# target instead. That file is owned by the ISO profile and has no [kedra] entry,
# which meant a Kedra target could not resolve kedra-hooks at all -- not during
# pacstrap, and not after reboot. Which repositories an installed Kedra system
# has is an installer decision, so the file now lives here, in the installer.
#
# The shellprocess-before-online job copies this into ${ROOT}/etc/pacman.conf and
# then runs `detect-architecture` over it, which inserts the CachyOS v3 / v4 /
# znver4 repositories immediately above [cachyos] on capable CPUs. That sed match
# is `/^\[cachyos\]$/`, so the [cachyos] section header below must stay exactly
# as written, on its own line, with no SigLevel line between it and the insertion
# point.
#

#
# GENERAL OPTIONS
#
[options]
HoldPkg     = pacman glibc
Architecture = auto

# Misc options
Color
ILoveCandy
VerbosePkgLists
DisableDownloadTimeout
ParallelDownloads = 10
DownloadUser = alpm

# Signature verification is ENABLED, globally, for every repository below.
#
# `DatabaseOptional` tolerates a repository database that carries no signature at
# all; it does NOT ignore one that is present. [kedra] ships a signed kedra.db,
# so that database is verified too. `SigLevel = Never` appears nowhere in Kedra,
# and no repository below weakens the global setting.
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
#RemoteFileSigLevel = Required

#
# REPOSITORIES
#
# Ordering is the accepted Kedra ordering:
#
#     [kedra] -> [cachyos] -> [core] -> [extra] -> [multilib]
#
# pacman resolves a name from the FIRST repository that carries it, so [kedra]
# sits on top. That priority is the mechanism by which kedra-hooks replaces
# cachyos-hooks and by which Kedra keeps its identity across a full `pacman -Syu`.
# The hazard of top priority is contained outside pacman, by kedra-repo's
# publishing allowlist -- [kedra] may only ever carry names Kedra genuinely owns.
#

## [kedra] -- DEVELOPMENT / MILESTONE 0 INFRASTRUCTURE
##
## No Kedra hosting exists yet and no Kedra domain has been chosen, so there is
## no HTTPS URL to point at and a plausible-looking one that does not resolve
## would be worse than none.
##
## Instead, the installer copies the signed [kedra] repository snapshot off the
## live medium into this machine at /var/lib/kedra/dev-repo (see
## /etc/calamares/scripts/kedra-target-repository). The snapshot contains
## packages and database only -- never key material -- and its signatures are
## verified by pacman exactly as a remote repository's would be.
##
## This is what makes the entry survive the installation: a `file://` path that
## only existed in the live environment would leave a dead repository behind on
## first boot. This one is on the installed disk, so `pacman -Syu` works after
## reboot as it did during installation.
##
## MOVING TO PRODUCTION HOSTING is a one-line change:
##
##     Server = https://<kedra-host>/$repo/os/$arch
##
## The docroot layout under /var/lib/kedra/dev-repo is already the future HTTPS
## layout ($repo/os/$arch), so nothing else moves. At that point
## kedra-target-repository stops being needed and /var/lib/kedra can be removed.
## It is deliberately NOT in /usr, so it is not pretending to be package-managed.
[kedra]
SigLevel = Required DatabaseOptional
Server = file:///var/lib/kedra/dev-repo/$repo/os/$arch

## CachyOS. Kedra's kernels (linux-cachyos), optimised builds, performance
## defaults and hardware tooling all come from here, verified against
## cachyos-keyring. Deliberately NOT replaced by stock Arch equivalents.
##
## `detect-architecture` inserts [cachyos-v3] / [cachyos-v4] / [cachyos-znver4]
## and their -core/-extra companions directly above this header when the CPU
## supports them. Do not add anything between this comment and the header.
[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

# The testing repositories are disabled by default. To enable, uncomment the
# repo name header and Include lines.

#[core-testing]
#Include = /etc/pacman.d/mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

#[extra-testing]
#Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# If you want to run 32 bit applications on your x86_64 system,
# enable the multilib repositories as required here.

#[multilib-testing]
#Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# An example of a custom package repository.  See the pacman manpage for
# tips on creating your own repositories.
#[custom]
#SigLevel = Optional TrustAll
#Server = file:///home/custompkgs
