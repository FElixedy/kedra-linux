#
# sets the netinstall package groups list.
#
# KEDRA: upstream lists TWO sources here -- CachyOS's netinstall.yaml on
# raw.githubusercontent.com first, and the locally installed copy only as a
# fallback if the fetch fails. Inherited unchanged, that would mean every Kedra
# installation with working network silently installed CachyOS's package
# selection instead of Kedra's: the local netinstall.yaml in this package
# (kedra-hooks, kedra-keyring, the GNOME set) would be used only when GitHub was
# unreachable, which is the one case nobody tests.
#
# Package selection is Kedra's decision and must not be a live fetch from
# another distribution's repository, so the remote source is removed and the
# file shipped by this package is the only one.
#
# When Kedra has hosting, a Kedra-owned HTTPS URL may be prepended here to allow
# updating package selection without shipping a new installer package. That is a
# deliberate future choice, not a leftover.
---

groupsUrl:
 - file:///etc/calamares/modules/netinstall.yaml

required: true

label:
 sidebar: "Packages"
