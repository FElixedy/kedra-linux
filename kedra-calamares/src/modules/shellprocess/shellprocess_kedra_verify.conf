# SPDX-License-Identifier: CC0-1.0
#
# KEDRA: assert that the finished target really is a Kedra system.
#
# Runs chrooted, last in the exec sequence apart from cleanup, so it sees the
# target exactly as the user will boot it. The script does not start with "-", so
# a failure aborts the installation instead of being reported as success -- which
# is the whole point: every condition it checks for is otherwise silent, and
# surfaces later as a system that cannot verify or update its own packages.
#
# See src/scripts/kedra-verify-target for what is checked and why.
---

dontChroot: false
timeout: 120
script:
    - command: "/etc/calamares/scripts/kedra-verify-target"
      verbose: true
    - "-rm /etc/calamares/scripts/kedra-verify-target"

i18n:
    name: "Verifying the installed Kedra system"
