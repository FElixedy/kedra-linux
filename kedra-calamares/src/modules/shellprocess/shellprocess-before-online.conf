# SPDX-License-Identifier: CC0-1.0
#
# Configuration for the shell process job.
#
# Executes a list of commands found under the key *script*.
# If the top-level key *dontChroot* is true, then the commands
# are executed in the context of the live system, otherwise
# in the context of the target system. In all of the commands,
# the following substitutions will take place:
#  - `${ROOT}` is replaced by the root mount point of the **target**
#    system from the point of view of the command (for chrooted
#    commands, that will be */*).
#  - `@@USER@@` is replaced by the username, set on the user page.
#
# The (global) timeout for the command list can be set with
# the *timeout* key. The value is a time in seconds, default
# is 10 seconds if not set.
#
# If a command starts with "-" (a single minus sign), then the
# return value of the command following the - is ignored; otherwise,
# a failing command will abort the installation. This is much like
# make's use of - in a command.
#
# The value of *script* may be:
#   - a single string; this is one command that is executed.
#   - a list of strings; these are executed one at a time, by
#     separate shells (/bin/sh -c is invoked for each command).
#   - an object, specifying a key *command* and (optionally)
#     a key *timeout* to set the timeout for this specific
#     command differently from the global setting.
---
i18n:
     name: "Preparing your system for the installation of Kedra Linux"
     name[de]: "Vorbereiten Ihres Systems für die Installation von Kedra Linux"
     name[fr]: "Préparation de votre système pour l'installation de Kedra Linux"
     name[es]: "Preparación de su sistema para la instalación de Kedra Linux"
     name[ru]: "Подготовка вашей системы к установке Kedra Linux"

dontChroot: true
# KEDRA: 10s is upstream's value and was enough for two `cp`s. Copying the
# [kedra] snapshot is a few hundred kilobytes, but the target is a fresh
# filesystem on unknown hardware, so this is no longer a 10-second job.
timeout: 300
script:
    # KEDRA: was `cp /etc/pacman-more.conf ${ROOT}/etc/pacman.conf`.
    #
    # /etc/pacman-more.conf belongs to the ISO profile and has no [kedra] entry,
    # so a target configured from it could not resolve kedra-hooks -- neither
    # during pacstrap nor after reboot. Which repositories an installed Kedra
    # system has is an installer decision, so the file is now shipped by this
    # package. See src/kedra/pacman.conf for the full reasoning.
    #
    # The ISO's /etc/pacman-more.conf is now unused by the online path and can be
    # dropped from kedra-iso in a later cleanup.
    - command: "cp /etc/calamares/kedra/pacman.conf ${ROOT}/etc/pacman.conf"
    # Unchanged upstream mechanism: inserts the CachyOS v3/v4/znver4 repositories
    # above [cachyos] when this CPU supports them. Runs on the target config.
    - command: "/etc/calamares/scripts/detect-architecture ${ROOT}/etc/pacman.conf"
    # KEDRA: put a working, signed [kedra] on the installed disk. Must run before
    # pacstrap, which is the first thing to resolve a package out of [kedra].
    - command: "/etc/calamares/scripts/kedra-target-repository ${ROOT}"
      timeout: 300
      verbose: true
