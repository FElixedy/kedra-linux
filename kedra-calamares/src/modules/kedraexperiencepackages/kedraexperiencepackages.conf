---
# Where the shipped Experience resolver lives on the live medium.
#
# /usr/bin/kedra-experience is installed by kedra-experience-runtime, which the
# ISO package list carries. It is named here rather than hardcoded in main.py so
# a test can point at a build tree, and so the path is visible to anyone reading
# the installer's configuration.
resolver: "/usr/bin/kedra-experience"

# The resolve document shapes this module understands. A resolver that answers
# with anything else is a version skew between the installer and
# kedra-experience-runtime, and is refused rather than parsed optimistically --
# see main.py.
supportedResolveSchemas: [ 2 ]
