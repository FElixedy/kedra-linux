---
# The shipped Kedra Experience resolver.
#
# Installed by kedra-experience-runtime, which the live ISO carries. The page
# runs `<resolver> profiles --format json` and renders what comes back; if the
# program is missing the step reports that and cannot be left, so an
# installation never silently continues as Vanilla.
resolver: "/usr/bin/kedra-experience"

# The preset a "Custom" choice derives from, and the product preselected on the
# page. The module checklist is built from THIS preset's resolved module list --
# the modules themselves are never listed here.
basePreset: "kedra"

# The profiles-document shape this page was written against. A resolver that
# answers with any other version is refused rather than rendered.
profilesSchemaVersion: 1
