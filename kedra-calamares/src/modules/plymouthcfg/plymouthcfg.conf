#
# Plymouth Configuration Module
#
# This module can be used to setup the default plymouth theme to 
# be used with your distribution
#
# You should only use this module if the plymouth package is installed 
# on the build configurations of your distribution & the plymouth 
# theme you want to configure is installed as well. If the unpacked
# filesystem configures a plymouth theme already, there is no need
# to change it here.
---


# Leave this commented if you want to use the default theme 
# shipped with your distribution configurations. Make sure that 
# the theme exists in the themes directory of plymouth path. 
# Debian / Ubuntu comes with themes "joy", "script", "softwaves",
# possibly others. Look in /usr/share/plymouth/themes for more.
#
# Specifying a non-existent theme will leave the plymouth
# configuration set to that theme. It is up to plymouth to
# deal with that.

# KEDRA: was `cachyos-bootanimation`, with `cachyos` as the AMD GPU variant.
#
# This is not a dormant setting: the bootloader module appends `splash` to the
# kernel command line whenever plymouth is installed, so the configured theme is
# what every boot of the installed system actually displays. A CachyOS boot
# animation on a Kedra machine is one of the more visible branding bugs there is.
#
# `bgrt` is the stock upstream-plymouth theme and Arch's own default: it shows the
# firmware's own logo where one exists and a plain spinner otherwise. Plymouth
# itself is kept -- a graphical boot is a real feature and its initramfs hook is
# part of the CachyOS mkinitcpio integration. Only the artwork changed, which is
# also why cachyos-plymouth-theme and cachyos-plymouth-bootanimation are no longer
# installed (see pacstrap.conf).
#
# A Kedra boot animation is deferred visual branding.
plymouth_theme: bgrt

# No plymouth_theme_amdgpu: upstream needed a second theme because its animated
# theme misbehaved on amdgpu. A stock theme needs no such workaround.

