#
### pacstrap Module
#
# This module installs the base system and then copies files
# into the installation that will be used in the installed system
#

---
# basePackages is an array of package names to pass to pacstrap
#
basePackages:
  - base
  - base-devel
  - btrfs-progs
  # KEDRA identity and trust, installed by the very first pacman transaction that
  # touches the target so the target is a Kedra system from its first package on.
  #
  # kedra-hooks is where cachyos-hooks used to be listed. It declares
  # provides/conflicts/replaces cachyos-hooks, so pacman does the substitution
  # itself -- nothing here deletes or overwrites CachyOS files behind pacman's
  # back, and `pacman -Qq` will never list a package named cachyos-hooks.
  #
  # kedra-keyring is named explicitly rather than left to dependency resolution:
  # nothing depends on it (kedra-hooks deliberately does not), and its install
  # scriptlet is what runs `pacman-key --populate kedra` inside the target.
  - kedra-hooks
  - kedra-keyring
  # CachyOS trust and mirror infrastructure, retained: the target keeps resolving
  # kernels and optimised builds from the CachyOS repositories.
  - cachyos-keyring
  - cachyos-mirrorlist
  - cachyos-v4-mirrorlist
  - cachyos-v3-mirrorlist
  - cachyos-rate-mirrors
  - cachyos-settings
  - cryptsetup
  - device-mapper
  - diffutils
  - dosfstools
  - e2fsprogs
  - efibootmgr
  - exfatprogs
  - f2fs-tools
  - inetutils
  - jfsutils
  - less
  - linux-firmware
  - logrotate
  - lsb-release
  - lvm2
  - man-db
  - man-pages
  - mdadm
  - chwd
  - mkinitcpio
  - netctl
  - os-prober
  - perl
  - python
  - s-nail
  - sudo
  - sysfsutils
  - texinfo
  - usbutils
  - which
  - xfsprogs
  # KEDRA: plymouth stays; cachyos-plymouth-bootanimation and
  # cachyos-plymouth-theme are dropped. They are pure artwork, and the theme they
  # install is what the installed system's boot splash would display
  # (plymouthcfg.conf explains the full reasoning). The stock `bgrt` theme that
  # plymouth itself ships is used instead.
  - plymouth

#
# postInstallFiles is an array of file names which will be copied into the system
#
# The paths should be relative to the host and the files will be copied to the
# location in the installed system
#
postInstallFiles:
  - "/etc/mkinitcpio.conf"
  - "/etc/calamares/scripts/dmcheck"
  - "/usr/local/bin/remove-nvidia"
  - "/etc/calamares/scripts/enable-ufw"
  - "/etc/calamares/scripts/bootloader-post-setup"
  - "/etc/calamares/scripts/shell-setup"
  - "/etc/calamares/scripts/btrfs-installation-snapshot"
  # KEDRA: the post-install assertion runs chrooted, so it has to be inside the
  # target. shellprocess_kedra_verify removes it again afterwards.
  - "/etc/calamares/scripts/kedra-verify-target"
