#
# Create, overwrite or update /etc/default/grub in the target system.
#
# Write lines to /etc/default/grub (in the target system) based
# on calculated values and the values set in the *defaults* key
# in this configuration file.
#
# Calculated values are:
#   - GRUB_DISTRIBUTOR,   branding module, *bootloaderEntryName* (this
#     string is sanitized, and see also setting *keep_distributor*)
#   - GRUB_ENABLE_CRYPTODISK, based on the presence of filesystems
#     that use LUKS
#   - GRUB_CMDLINE_LINUX_DEFAULT, adding LUKS setup and plymouth
#     support to the kernel.

---
overwrite: false

prefer_grub_d: false

keep_distributor: false

kernel_params:
  - "nowatchdog"
  - "nvme_load=YES"

defaults:
    GRUB_TIMEOUT: 5
    # Technical, not branding: this is the filename the linux-cachyos package
    # installs. Kedra uses CachyOS kernels, so the path is correct as written.
    GRUB_TOP_LEVEL: "/boot/vmlinuz-linux-cachyos"
    GRUB_DISABLE_SUBMENU: false
    GRUB_DISABLE_OS_PROBER: false
    GRUB_DISABLE_RECOVERY: true
    # KEDRA: was "/usr/share/grub/themes/cachyos/theme.txt". That theme paints
    # the CachyOS logo and wordmark over the boot menu of every installed system,
    # which is user-facing branding the installer controls -- and it is why
    # cachyos-grub-theme is no longer pulled in for the GRUB path (see
    # pacstrap/main.py). Empty means the stock GRUB menu, whose title comes from
    # GRUB_DISTRIBUTOR, which `keep_distributor: false` above makes Calamares
    # write from branding bootloaderEntryName -> "Kedra". GRUB's own 10_linux
    # generator then composes the menu entry as "Kedra Linux"; see the comment
    # on bootloaderEntryName in src/branding/kedra/branding.desc for why the
    # branding value must not itself contain the word "Linux".
    #
    # A Kedra GRUB theme is deferred visual branding, not a missing feature.
    GRUB_THEME: ""
    GRUB_EARLY_INITRD_LINUX_STOCK: ""

# Set to true to force defaults to be used even when not overwriting
always_use_defaults: true
