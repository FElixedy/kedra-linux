# Kedra Experience module: extensions
#
# ARCHITECTURE DEFINITION ONLY. No extension is installed, enabled, listed or
# configured by this task. The extension set is deliberately absent.

schema_version = 6

[module]
id = "extensions"
name = "GNOME Extensions"
description = "Curated GNOME Shell extension set and its enablement policy."
# Bumped for the schema 3 settings/migrations record format.
version = "0.2.0"
tier = "optional"
user_selectable = true
introduced_in = "0.1.0"

# No relationship to `desktop`. What extensions actually need is GNOME Shell
# itself, and that is declared directly below as a required *package*. Nothing
# here consumes a Desktop setting; when the curated extension set lands, an
# extension that genuinely depends on one should add the relationship then, with
# the evidence in hand.
requires = []
conflicts = []

# Setting declarations (schema 3). Empty: no real GNOME values ship yet.
settings = []

# Migration records (schema 3). Empty until a setting evolves.
migrations = []

[[module.packages]]
name = "gnome-shell"
relation = "required"
reason = "Extensions are loaded by GNOME Shell."

[[module.packages]]
name = "gnome-shell-extension-manager"
relation = "optional"
reason = "Lets users manage the set Kedra ships. Not required for the set itself."
